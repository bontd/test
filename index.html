<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <!-- Slick CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>
    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css"/>
    <link rel="stylesheet" href="./common/css/common.css">
    <link rel="stylesheet" href="./common/css/style.css">
</head>
<body>
    <section class="section banner col overflow-hidden" style="background-image: url('./common/images/top/banner.png')">
        <div class="banner-item banner-left d-flex justify-content-center">
            <h1 class="d-flex align-items-center text-light gap-1">
                <span class="d-flex flex-column fs-40 lh-14 text-right">
                    <span data-aos="fade-right" data-aos-delay="700">ĐÔ THỊ SINH THÁI</span>
                    <span data-aos="fade-right" data-aos-delay="800">TÍCH HỢP</span>
                    <span data-aos="fade-right" data-aos-delay="900">NGHỆ THUẬT</span>
                </span>
                <span class="headding-1 fs-60 lh-10 mt-10 pt-5 ml-3" data-aos="fade-left" data-aos-delay="300">Di sản</span>
            </h1>
        </div>
        <div class="banner-item banner-right d-flex flex-column align-items-end px-13 text-primary">
            <div class="d-grid grid-column-3 gap-3q fs-12 mb-4">
                <div data-aos="fade-left" data-aos-delay="1200">
                    <img src="" alt="">
                    Tổng diện tích quy hoạch: <br>Gần 60ha
                </div>
                <div data-aos="fade-left" data-aos-delay="1400">
                    <img src="" alt="">
                    Vị trí: Xã Nghĩa Trụ, <br>tỉnh Hưng Yên
                </div>
                <div data-aos="fade-left" data-aos-delay="1600">
                    <img src="" alt="">
                    Số lượng: <br>Gần 8000 căn hộ cao cấp
                </div>
            </div>
            <h2 class="fs-40 font-begum" data-aos="fade-left" data-aos-delay="1000">
                & CÔNG NGHỆ THỜI ĐẠI <br>PHÍA ĐÔNG HÀ NỘI
            </h2>
        </div>
    </section>
    <section class="section">
        <div class="slider">
            <div class="slide">
                <div class="slide-animate">
                    <img src="./common/images/top/slide-01.png" alt="">
                    <div class="col slide-content font-begum d-flex flex-column align-items-center justify-content-center fs-30">
                        <span class="slide-fade right">TỔ HỢP VĂN HÓA</span>
                        <span class="slide-fade left">NGHỆ THUẬT ĐƯƠNG ĐẠI TRÊN SÔNG</span>
                    </div>
                </div>
            </div>
            <div class="slide">
                <div class="slide-animate">
                    <img src="./common/images/top/slide-02.png" alt="">
                    <div class="col slide-content font-begum d-flex flex-column align-items-center justify-content-center fs-30">
                        <span class="slide-fade right">TỔ HỢP VĂN HÓA</span>
                        <span class="slide-fade left">NGHỆ THUẬT ĐƯƠNG ĐẠI TRÊN SÔNG</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- jQuery + Slick JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="./common/js/gsap.min.js"></script>
    <script src="./common/js/CustomEase.min.js"></script>
    <script src="./common/js/ScrollTrigger.min.js"></script>
    <script src="./common/js/ScrollSmoother.min.txt"></script>
    <script src="./common/js/common.js"></script>

    <script>
        $(document).ready(function(){
            AOS.init();
            $('.slider').slick({
                slidesToShow: 1,
                dots: true,
                arrows: true,
                centerMode: true,
                centerPadding: "10%",
                speed: 1000,
            });

            $('.slider').on('beforeChange', function(event, slick, currentSlide, nextSlide) {
                $('.slick-slide').removeClass('active');
                $(slick.$slides[nextSlide]).find('img').animate({
                    opacity: 1,
                    transform: 'scale(1)'
                }, 500);
            });

            $('.slider').on('afterChange', function(event, slick, currentSlide) {
                console.log('Sau khi đổi, đang ở slide:', currentSlide);
            });
        });
    </script>
</body>
</html>
